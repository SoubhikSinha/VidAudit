[project]
name = "complianceqapipeline"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "SoubhikSinha", email = "hackos.sinha@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "azure-identity",
    "azure-monitor-opentelemetry",
    "azure-search-documents",
    "azure-storage-blob",
    "fastapi",
    "firecrawl-py",
    "langchain",
    "langchain-community",
    "langchain-openai",
    "langgraph",
    "langsmith",
    "opentelemetry-instrumentation-fastapi",
    "pandas",
    "psycopg2-binary",
    "pydantic",
    "pypdf",
    "python-dotenv",
    "redis",
    "requests",
    "sqlalchemy",
    "streamlit",
    "uvicorn",
    "yt-dlp",
]

[project.scripts]
complianceqapipeline = "complianceqapipeline:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"
